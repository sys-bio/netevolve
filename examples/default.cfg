# netevolve default configuration (SPEC §2).
seed = 42
population = 200
generations = 500
elite_fraction = 0.1
parent_fraction = 0.3
n_floating = 4
n_boundary = 2
r_min = 3
r_max = 12
r_initial = 6
k_min = 0.01
k_max = 100
mut_sigma = 0.5
p_rate = 0.7
p_add = 0.15
p_delete = 0.10
p_rewire = 0.05
t_end = 100
n_points = 1000
transient_fraction = 0.5
n_target = 5
min_rel_amplitude = 0.01
max_conc = 1e6
target_fitness = 0.99
recheck_threshold = 0.9   # re-check scores >= this at tight tolerance (> 1 = off)
recheck_rtol = 1e-10
recheck_atol = 1e-14
# solver = cvode     # default: cvode (auto in builds without CVODE); also auto, rk45, rosenbrock
max_steps = 50000    # step budget per simulation
osc_conc_floor = 1e-12   # an oscillating species dipping below this scores 0 (0 = off)
objective = oscillation  # or timeseries (needs target_file)
# target_file = target.txt   # two columns: time, concentration (relative to this file)
output_dir = out
threads = 0          # 0 = use all cores
